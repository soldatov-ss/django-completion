[project]
site_name = "django-completion"
site_url = "https://soldatov-ss.github.io/django-completion/"
repo_url = "https://github.com/soldatov-ss/django-completion"
repo_name = "soldatov-ss/django-completion"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "For AI agents" = "agents.md" },
  { "Comparison" = "comparison.md" },
  { "Usage" = "usage.md" },
  { "How it works" = "how_it_works.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "API Reference" = "api.md" },
]

[project.theme]
custom_dir = "overrides"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
