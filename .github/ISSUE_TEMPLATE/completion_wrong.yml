name: Completion Missing or Wrong
description: Report incorrect, missing, or stale shell completion candidates.
title: "COMPLETION: "
labels: [bug, completion]
body:
  - type: textarea
    id: problem
    attributes:
      label: What completion is wrong?
      description: Include the exact command line where you pressed Tab and what appeared.
      placeholder: |
        Command: `python manage.py migrate accounts <TAB>`
        Expected: `0001_initial 0002_add_profile zero`
        Actual: no completions
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status diagnostics
      description: Paste the output of `python manage.py autocomplete status --verbose`.
      render: text
    validations:
      required: true
  - type: input
    id: django-completion-version
    attributes:
      label: django-completion version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: django-version
    attributes:
      label: Django version
      placeholder: "5.2"
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - bash
        - zsh
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows / WSL
        - Other
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: Install method
      placeholder: "pip install, uv add, source checkout"
    validations:
      required: true
  - type: input
    id: invocation-style
    attributes:
      label: Invocation style
      placeholder: "python manage.py, ./manage.py, uv run python manage.py"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra details
      description: Mention custom `MIGRATION_MODULES`, Docker, shell plugins, aliases, or wrappers if relevant.
    validations:
      required: false
